    <link
        href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050510;
            --bg-gradient: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
            --accent-purple: #a855f7;
            --accent-cyan: #00d4ff;
            --accent-pink: #ff6b9d;
            --accent-gold: #ffd700;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --sidebar-width: 336px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 10px;
            transition: 0.3s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            touch-action: manipulation;
        }

        /* Layout */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding: 0; /* 제거: 20px -> 0 */
            gap: 0;    /* 제거: 20px -> 0 */
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: none;
            border-right: 1px solid var(--glass-border);
            border-radius: 0; /* 제거: 24px -> 0 */
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            z-index: 10;
        }

        .main-content {
            flex: 1;
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: none;
            border-radius: 0; /* 제거: 24px -> 0 */
            overflow: hidden;
        }

        /* Sidebar Elements */
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .logo {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            letter-spacing: -0.8px;
        }

        .logo .title-emoji {
            filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.5));
            -webkit-text-fill-color: initial;
            background: none;
        }

        .logo .title-text {
            /* 프리미엄 금속 광택 효과 */
            background: linear-gradient(
                to right, 
                var(--accent-cyan) 0%, 
                #fff 45%, 
                #fff 55%, 
                var(--accent-cyan) 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .header-btns {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .help-btn, .sound-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .help-btn:hover, .sound-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-2px);
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            transition: 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .select-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 60px;
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            color: #fff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-primary:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-primary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        .btn-secondary {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Ranking Board */
        .ranking-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #rankingList {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .ranking-item:last-child {
            margin-bottom: 0;
        }

        .rank {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
        }

        .ranking-item .rank.rank-1 {
            background: linear-gradient(135deg, #fbbf24, #b45309);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
        }

        .ranking-item .rank.rank-2 {
            background: linear-gradient(135deg, #e2e8f0, #475569);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 12px rgba(226, 232, 240, 0.2);
        }

        .ranking-item .rank.rank-3 {
            background: linear-gradient(135deg, #d97706, #78350f);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.2);
        }

        /* Toast Popup */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 100000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .ranking-item .name {
            flex: 1;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ranking-item .metrics {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
            margin-right: 12px;
            line-height: 1.1;
        }

        .ranking-item .status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 700;
            min-width: 65px;
            text-align: right;
        }

        .ranking-item .status.eliminated {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .particle-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan);
        }

        .status.eliminated {
            color: var(--accent-pink);
            opacity: 0.6;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-cyan);
        }

        /* Canvas Area */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .copyright {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            user-select: none;
        }

        /* Kill Feed */
        .kill-feed {
            position: absolute;
            top: 60px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 1000;
            align-items: flex-end;
        }

        .kill-item {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-left: 3px solid var(--accent-pink);
            color: rgba(255, 255, 255, 0.9);
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            animation: killSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                killFadeOut 0.5s ease-in 4s forwards;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--accent-pink);
        }

        @keyframes killSlideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes killFadeOut {
            to {
                transform: translateX(20px);
                opacity: 0;
            }
        }

        /* Cinematic Victory Overlay (Transplanted from Neon Race style) */
        .winner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            z-index: 10000;
            overflow-y: auto;
        }

        .winner-overlay.active {
            display: flex;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .result-header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 40px;
        }

        .winner-label {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 15px;
        }

        .winner-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 5rem;
            color: var(--accent-purple);
            margin-bottom: 10px;
            text-shadow: 0 0 30px var(--accent-purple);
            animation: championGlow 2s infinite alternate, championPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes championGlow {
            0% {
                text-shadow: 0 0 20px var(--accent-purple), 0 0 40px var(--accent-cyan);
                color: #fff;
            }

            100% {
                text-shadow: 0 0 50px var(--accent-cyan), 0 0 80px var(--accent-purple);
                color: var(--accent-purple);
            }
        }

        @keyframes championPop {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-name-display {
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 40px;
            animation: namePulse 1.5s infinite ease-in-out;
            font-family: 'Black Han Sans', sans-serif;
        }

        @keyframes namePulse {

            0%,
            100% {
                transform: scale(1);
                text-shadow: 0 0 15px #fff;
            }

            50% {
                transform: scale(1.05);
                text-shadow: 0 0 30px var(--accent-cyan);
                color: var(--accent-cyan);
            }
        }

        .final-rankings {
            width: 100%;
            max-width: 520px;
            max-height: 40vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 40px;
            scrollbar-width: thin;
        }

        .final-rankings::-webkit-scrollbar {
            width: 6px;
        }

        .final-rankings::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .final-ranking-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.02);
            animation: resultSlideIn 0.5s ease forwards;
            opacity: 0;
            border: 1px solid transparent;
        }

        @keyframes resultSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .final-ranking-item.rank-1 {
            background: linear-gradient(90deg, rgba(234, 179, 8, 0.15), transparent);
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .final-ranking-item.rank-2 {
            background: linear-gradient(90deg, rgba(148, 163, 184, 0.1), transparent);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .final-ranking-item.rank-3 {
            background: linear-gradient(90deg, rgba(180, 83, 9, 0.1), transparent);
            border: 1px solid rgba(180, 83, 9, 0.2);
        }

        .final-pos {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            font-weight: 800;
            font-size: 1rem;
        }

        .rank-1 .final-pos {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .rank-2 .final-pos {
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            color: #000;
        }

        .rank-3 .final-pos {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #fff;
        }

        .final-name {
            flex: 1;
            font-weight: 600;
            font-size: 1.2rem;
            color: #fff;
        }

        .final-score {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .rank-1 .final-score,
        .rank-2 .final-score,
        .rank-3 .final-score {
            color: #fff;
            font-weight: 600;
        }

        .result-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            width: 100%;
            max-width: 520px;
        }

        .winner-btn {
            flex: 1;
            padding: 18px;
            font-size: 1.1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Global Game Timer */
        #gameTimer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            border: 1px solid var(--glass-border);
            color: var(--accent-cyan);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 10px rgba(0, 212, 255, 0.2);
            z-index: 150;
            display: none;
            text-align: center;
            min-width: 140px;
        }

        #gameTimer.active {
            display: block;
        }

        /* Result Overlay */
        .result-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.5s ease-out;
        }

        .result-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .winner-card {
            text-align: center;
            padding: 40px;
            border-radius: 32px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);

        .winner-label {
            font-size: 1.2rem;
            color: var(--accent-purple);

        .winner-name {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 5rem;
            background: linear-gradient(135deg, var(--accent-gold), #fff, var(--accent-cyan));

            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.4));
            animation: winnerPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes winnerPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .winner-card {
            display: contents;

        }

        /* Mobile Responsive */
        @media (max-width: 768px) {

                height: auto;
