    <script>
        const MAX_PARTICIPANTS = 100;
        const ORBIT_STEP = 1 / 60;

        /**
         * 0. Audio Engine
         */
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.setupToggleButton();
            }
            setupToggleButton() {
                const btn = document.getElementById('soundToggle');
                if (btn) {
                    btn.onclick = () => {
            this.enabled = !this.enabled;
            btn.textContent = this.enabled ? '🔊' : '🔇';
            btn.setAttribute('aria-pressed', String(this.enabled));
            btn.setAttribute('aria-label', this.enabled ? '소리 끄기' : '소리 켜기');
                        if (this.enabled && this.ctx && this.ctx.state === 'suspended') {
                            this.ctx.resume();
                        }
                    };
                }
            }
            init() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playStart() {
                if (!this.enabled || !this.ctx) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(40, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 1);
            }
            playCrash() {
                if (!this.enabled || !this.ctx) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime + 0.5);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.5);
            }
            playLost() {
                if (!this.enabled || !this.ctx) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
            playWin() {
                if (!this.enabled || !this.ctx) return;
                this.init();
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + i * 0.1 + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.1);
                    osc.stop(this.ctx.currentTime + i * 0.1 + 0.4);
                });
            }
        }

        /**
         * 1. Utilities
         */
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = toast.querySelector('.toast-text');
            toastText.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }


        class MouseParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 2 + 1;
                this.alpha = 1.0;
                this.color = Math.random() < 0.5 ? '#7dd3fc' : '#fff'; // Cyan or White
            }
            update(dt) {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= dt * 1.5;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ExplosionParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 3 + 1;
                this.alpha = 1.0;
                this.color = color;
            }
            update(dt) {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.alpha -= dt * 1.2;
            }
            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class RandomSource {
            next() {
                return Math.random();
            }
            range(min, max) {
                return min + this.next() * (max - min);
            }
        }

        /**
         * 2. Physics Engine
         */
        const CONFIG = {
            G: 1200, // Gravitational Constant
            FRICTION: 0.9995, // Space friction
            PLANET_MASS: 6000,
            PLANET_RADIUS: 45,
            LBound: 600, // Edge distance from center
            PARTICLE_RADIUS: 6,
            TARGET_RADIUS: 180,
            TARGET_WIDTH: 40
        };

        /**
         * Visual assets (cached offscreen sprites). Pure rendering — never touches game RNG/state.
         */
        const OrbitArt = (() => {
            const PLANET_SPAN = 3.2;   // sprite size / body radius (room for glow)
            const LABEL_SCALE = 2;     // label sprites are rendered at 2x for crispness
            const DISK_WORLD = 160;    // accretion disk sprite covers this world radius
            let seed = 1337;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) >>> 0;
                return seed / 4294967296;
            };
            const makeCanvas = (w, h) => {
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.ceil(w));
                c.height = Math.max(1, Math.ceil(h || w));
                return c;
            };
            const hueOf = color => {
                const m = /hsl\(\s*([\d.]+)/.exec(color);
                return m ? parseFloat(m[1]) : 270;
            };

            function planetSprite(color) {
                const hue = hueOf(color);
                const S = 64;
                const c = makeCanvas(S);
                const g = c.getContext('2d');
                const cx = S / 2;
                const R = S / PLANET_SPAN;
                // Atmosphere glow
                const glow = g.createRadialGradient(cx, cx, R * 0.8, cx, cx, S / 2);
                glow.addColorStop(0, `hsla(${hue}, 90%, 65%, 0.55)`);
                glow.addColorStop(0.45, `hsla(${hue}, 90%, 60%, 0.16)`);
                glow.addColorStop(1, `hsla(${hue}, 90%, 60%, 0)`);
                g.fillStyle = glow;
                g.fillRect(0, 0, S, S);
                // Sphere body, lit from +x (sprite is rotated to face the hole)
                g.save();
                g.beginPath();
                g.arc(cx, cx, R, 0, Math.PI * 2);
                g.clip();
                const body = g.createRadialGradient(cx + R * 0.45, cx - R * 0.2, R * 0.1, cx, cx, R * 1.15);
                body.addColorStop(0, `hsl(${hue}, 85%, 86%)`);
                body.addColorStop(0.35, `hsl(${hue}, 78%, 62%)`);
                body.addColorStop(0.8, `hsl(${(hue + 20) % 360}, 70%, 30%)`);
                body.addColorStop(1, `hsl(${(hue + 30) % 360}, 70%, 14%)`);
                g.fillStyle = body;
                g.fillRect(0, 0, S, S);
                // Cloud bands
                g.globalAlpha = 0.22;
                for (let i = 0; i < 4; i++) {
                    const y = cx - R + (i + 0.6) * (R * 2 / 4.2);
                    g.fillStyle = i % 2 ? `hsl(${hue}, 60%, 85%)` : `hsl(${(hue + 25) % 360}, 70%, 25%)`;
                    g.beginPath();
                    g.ellipse(cx, y, R * 1.2, R * 0.12, 0.25, 0, Math.PI * 2);
                    g.fill();
                }
                // Night side
                g.globalAlpha = 1;
                const night = g.createLinearGradient(cx + R, cx, cx - R, cx);
                night.addColorStop(0, 'rgba(0,0,0,0)');
                night.addColorStop(0.55, 'rgba(0,0,0,0.15)');
                night.addColorStop(1, 'rgba(2,0,12,0.75)');
                g.fillStyle = night;
                g.fillRect(0, 0, S, S);
                g.restore();
                // Warm rim light from the accretion disk
                g.lineWidth = 1.6;
                const rim = g.createLinearGradient(cx - R, cx, cx + R, cx);
                rim.addColorStop(0, 'rgba(255,200,140,0)');
                rim.addColorStop(0.7, 'rgba(255,210,150,0.15)');
                rim.addColorStop(1, 'rgba(255,230,190,0.95)');
                g.strokeStyle = rim;
                g.beginPath();
                g.arc(cx, cx, R - 0.6, 0, Math.PI * 2);
                g.stroke();
                return c;
            }

            function labelSprite(name, color, fontSize) {
                const k = LABEL_SCALE;
                const font = `700 ${fontSize}px 'Noto Sans KR', sans-serif`;
                const probe = makeCanvas(1).getContext('2d');
                probe.font = font;
                const tw = probe.measureText(name).width;
                const padX = 7, dot = 5, h = fontSize + 8;
                const w = tw + padX * 2 + dot + 5;
                const c = makeCanvas(w * k, h * k);
                const g = c.getContext('2d');
                g.scale(k, k);
                g.fillStyle = 'rgba(8, 6, 24, 0.72)';
                g.strokeStyle = color;
                g.globalAlpha = 1;
                g.beginPath();
                g.roundRect(0.5, 0.5, w - 1, h - 1, h / 2);
                g.fill();
                g.globalAlpha = 0.55;
                g.lineWidth = 1;
                g.stroke();
                g.globalAlpha = 1;
                g.fillStyle = color;
                g.beginPath();
                g.arc(padX + dot / 2, h / 2, dot / 2, 0, Math.PI * 2);
                g.fill();
                g.font = font;
                g.textBaseline = 'middle';
                g.fillStyle = '#f8f7ff';
                g.fillText(name, padX + dot + 5, h / 2 + 0.5);
                return c;
            }

            // Accretion disk layer (top-down), drawn rotated every frame
            function diskSprite(variant) {
                const S = 768;
                const c = makeCanvas(S);
                const g = c.getContext('2d');
                const cx = S / 2;
                const k = cx / DISK_WORLD;
                const inner = (CONFIG.PLANET_RADIUS + 3) * k;
                const outer = (variant === 0 ? 125 : 158) * k;
                seed = variant === 0 ? 4242 : 9001;
                if (variant === 0) {
                    const base = g.createRadialGradient(cx, cx, inner, cx, cx, outer);
                    base.addColorStop(0, 'rgba(255, 248, 225, 0.95)');
                    base.addColorStop(0.08, 'rgba(255, 196, 110, 0.9)');
                    base.addColorStop(0.3, 'rgba(255, 110, 60, 0.55)');
                    base.addColorStop(0.62, 'rgba(190, 60, 160, 0.25)');
                    base.addColorStop(1, 'rgba(120, 60, 240, 0)');
                    g.fillStyle = base;
                    g.beginPath();
                    g.arc(cx, cx, outer, 0, Math.PI * 2);
                    g.arc(cx, cx, inner, 0, Math.PI * 2, true);
                    g.fill();
                }
                // Spiral gas strands
                g.globalCompositeOperation = 'lighter';
                g.lineCap = 'round';
                const strands = variant === 0 ? 170 : 110;
                for (let i = 0; i < strands; i++) {
                    const t = rand();
                    const r0 = inner + Math.pow(t, 1.4) * (outer - inner);
                    const a0 = rand() * Math.PI * 2;
                    const len = 0.4 + rand() * 1.6;
                    const tight = (variant === 0 ? 0.10 : 0.16) * r0;
                    const hot = 1 - (r0 - inner) / (outer - inner);
                    const hue = 18 + hot * 30 - (variant === 1 ? 40 : 0);
                    const light = 55 + hot * 35;
                    g.strokeStyle = `hsla(${(hue + 360) % 360}, 100%, ${light}%, ${0.05 + hot * 0.22})`;
                    g.lineWidth = (0.8 + rand() * 2.4) * (variant === 0 ? 1 : 1.6);
                    g.beginPath();
                    const segs = 18;
                    for (let sgm = 0; sgm <= segs; sgm++) {
                        const a = a0 + len * sgm / segs;
                        const r = r0 - tight * (sgm / segs);
                        const x = cx + Math.cos(a) * r;
                        const y = cx + Math.sin(a) * r;
                        if (sgm === 0) g.moveTo(x, y); else g.lineTo(x, y);
                    }
                    g.stroke();
                }
                // Bright spiral arms (log spirals) for a clear swirling motion
                const arms = variant === 0 ? 3 : 2;
                for (let arm = 0; arm < arms; arm++) {
                    const phase = arm * Math.PI * 2 / arms + rand() * 0.4;
                    for (let pass = 0; pass < 3; pass++) {
                        g.strokeStyle = variant === 0
                            ? `rgba(255, ${190 - pass * 40}, ${130 - pass * 30}, ${0.16 - pass * 0.04})`
                            : `rgba(200, 120, 255, ${0.12 - pass * 0.03})`;
                        g.lineWidth = (variant === 0 ? 5 : 9) + pass * 8;
                        g.beginPath();
                        const steps = 60;
                        for (let st = 0; st <= steps; st++) {
                            const f = st / steps;
                            const r = outer * 0.95 * Math.exp(-f * Math.log(outer * 0.95 / (inner * 1.05)));
                            const a = phase + f * 3.4;
                            const x = cx + Math.cos(a) * r;
                            const y = cx + Math.sin(a) * r;
                            if (st === 0) g.moveTo(x, y); else g.lineTo(x, y);
                        }
                        g.stroke();
                    }
                }
                // Dark dust lanes for texture
                g.globalCompositeOperation = 'destination-out';
                for (let i = 0; i < 26; i++) {
                    const r = inner + 6 + rand() * (outer - inner - 6);
                    const a0 = rand() * Math.PI * 2;
                    g.strokeStyle = `rgba(0,0,0,${0.15 + rand() * 0.3})`;
                    g.lineWidth = 1 + rand() * 3;
                    g.beginPath();
                    g.arc(cx, cx, r, a0, a0 + 0.3 + rand() * 1.2);
                    g.stroke();
                }
                return c;
            }

            // Static core: lensing halo + photon ring + event horizon
            function coreSprite() {
                const S = 768;
                const c = makeCanvas(S);
                const g = c.getContext('2d');
                const cx = S / 2;
                const k = cx / DISK_WORLD;
                const R = CONFIG.PLANET_RADIUS * k;
                // Shadow cast inward from the horizon (disk dims near the hole)
                const shade = g.createRadialGradient(cx, cx, R, cx, cx, R * 1.25);
                shade.addColorStop(0, 'rgba(0,0,0,0.9)');
                shade.addColorStop(1, 'rgba(0,0,0,0)');
                g.fillStyle = shade;
                g.beginPath();
                g.arc(cx, cx, R * 1.25, 0, Math.PI * 2);
                g.fill();
                // Photon ring
                g.globalCompositeOperation = 'lighter';
                const ring = g.createRadialGradient(cx, cx, R * 0.98, cx, cx, R * 1.16);
                ring.addColorStop(0, 'rgba(255,255,255,0)');
                ring.addColorStop(0.25, 'rgba(255,240,215,0.95)');
                ring.addColorStop(0.5, 'rgba(255,170,90,0.45)');
                ring.addColorStop(1, 'rgba(255,120,60,0)');
                g.fillStyle = ring;
                g.beginPath();
                g.arc(cx, cx, R * 1.16, 0, Math.PI * 2);
                g.fill();
                // Event horizon
                g.globalCompositeOperation = 'source-over';
                const hole = g.createRadialGradient(cx, cx, 0, cx, cx, R);
                hole.addColorStop(0, '#000');
                hole.addColorStop(0.85, '#000');
                hole.addColorStop(1, '#05020a');
                g.fillStyle = hole;
                g.beginPath();
                g.arc(cx, cx, R * 1.01, 0, Math.PI * 2);
                g.fill();
                return c;
            }

            function haloSprite() {
                const S = 512;
                const c = makeCanvas(S);
                const g = c.getContext('2d');
                const cx = S / 2;
                const halo = g.createRadialGradient(cx, cx, 0, cx, cx, cx);
                halo.addColorStop(0, 'rgba(255, 170, 90, 0.35)');
                halo.addColorStop(0.18, 'rgba(255, 110, 80, 0.18)');
                halo.addColorStop(0.42, 'rgba(150, 70, 230, 0.1)');
                halo.addColorStop(1, 'rgba(60, 30, 140, 0)');
                g.fillStyle = halo;
                g.fillRect(0, 0, S, S);
                return c;
            }

            function background(w, h) {
                const far = makeCanvas(w, h);
                const near = makeCanvas(w, h);
                const g = far.getContext('2d');
                seed = 777;
                const cx = w / 2, cy = h / 2;
                const diag = Math.hypot(w, h) / 2;
                const base = g.createRadialGradient(cx, cy, 0, cx, cy, diag);
                base.addColorStop(0, '#0d0a24');
                base.addColorStop(0.5, '#060515');
                base.addColorStop(1, '#010104');
                g.fillStyle = base;
                g.fillRect(0, 0, w, h);
                // Nebula clouds
                const hues = [268, 286, 200, 320, 250, 190];
                const blobs = 22;
                for (let i = 0; i < blobs; i++) {
                    const ang = rand() * Math.PI * 2;
                    const dist = (0.25 + rand() * 0.75) * diag;
                    const x = cx + Math.cos(ang) * dist;
                    const y = cy + Math.sin(ang) * dist * 0.8;
                    const r = (0.15 + rand() * 0.3) * diag;
                    const hue = hues[i % hues.length];
                    const neb = g.createRadialGradient(x, y, 0, x, y, r);
                    const a = 0.05 + rand() * 0.07;
                    neb.addColorStop(0, `hsla(${hue}, 80%, 55%, ${a})`);
                    neb.addColorStop(0.5, `hsla(${hue + 20}, 80%, 40%, ${a * 0.45})`);
                    neb.addColorStop(1, `hsla(${hue}, 80%, 30%, 0)`);
                    g.fillStyle = neb;
                    g.fillRect(x - r, y - r, r * 2, r * 2);
                }
                // Dust specks inside nebula
                for (let i = 0; i < 1400; i++) {
                    g.fillStyle = `rgba(200, 180, 255, ${rand() * 0.05})`;
                    g.fillRect(rand() * w, rand() * h, 2, 2);
                }
                // Far stars
                const colors = ['#ffffff', '#ffffff', '#e0e7ff', '#bae6fd', '#fde68a', '#fbcfe8'];
                const farCount = Math.round(w * h / 900);
                for (let i = 0; i < farCount; i++) {
                    g.globalAlpha = 0.15 + rand() * 0.5;
                    g.fillStyle = colors[Math.floor(rand() * colors.length)];
                    const s = rand() < 0.85 ? 0.8 : 1.3;
                    g.fillRect(rand() * w, rand() * h, s, s);
                }
                g.globalAlpha = 1;
                // Near layer: brighter stars with soft glows and a few diffraction spikes
                const n = near.getContext('2d');
                const nearCount = Math.round(w * h / 9000);
                for (let i = 0; i < nearCount; i++) {
                    const x = rand() * w, y = rand() * h;
                    const r = 0.8 + rand() * 1.4;
                    const col = colors[Math.floor(rand() * colors.length)];
                    const glow = n.createRadialGradient(x, y, 0, x, y, r * 4);
                    glow.addColorStop(0, col);
                    glow.addColorStop(0.25, 'rgba(255,255,255,0.25)');
                    glow.addColorStop(1, 'rgba(255,255,255,0)');
                    n.globalAlpha = 0.5 + rand() * 0.5;
                    n.fillStyle = glow;
                    n.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
                    if (rand() < 0.1) {
                        n.strokeStyle = col;
                        n.globalAlpha = 0.35;
                        n.lineWidth = 0.7;
                        const L = r * 9;
                        n.beginPath();
                        n.moveTo(x - L, y); n.lineTo(x + L, y);
                        n.moveTo(x, y - L); n.lineTo(x, y + L);
                        n.stroke();
                    }
                }
                n.globalAlpha = 1;
                return { far, near };
            }

            return { PLANET_SPAN, LABEL_SCALE, DISK_WORLD, planetSprite, labelSprite, diskSprite, coreSprite, haloSprite, background };
        })();

        class Particle {
            constructor(name, x, y, vx, vy, color) {
                this.name = name;
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.isEliminated = false;
                this.reason = "";
                this.survivalTime = 0;
                this.orbitPoints = [];
                this.score = 0;
                this.history = [];
                this.minDist = Infinity;
                this.maxDist = 0;
            }

            update(dt, planet) {
                if (this.isEliminated) return;

                const dx = planet.x - this.x;
                const dy = planet.y - this.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Track Min/Max Radius
                if (dist < this.minDist) this.minDist = dist;
                if (dist > this.maxDist) this.maxDist = dist;

                // Boundary detection (relative to planet, fixed radius for stability)
                const centerDist = Math.max(Math.abs(this.x - planet.x), Math.abs(this.y - planet.y));
                if (centerDist > 1200) { // Stable absolute boundary
                    this.isEliminated = true;
                    this.reason = "LOST";
                    if (typeof game !== 'undefined') {
                        game.addKillMessage(this.name, this.reason);
                        game.sound.playLost();
                    }
                    return;
                }

                // Planet Collision
                if (dist < CONFIG.PLANET_RADIUS + CONFIG.PARTICLE_RADIUS) {
                    this.isEliminated = true;
                    this.reason = "CRASHED";
                    if (typeof game !== 'undefined') {
                        game.createExplosion(this.x, this.y, this.color);
                        game.addKillMessage(this.name, this.reason);
                        game.sound.playCrash();
                    }
                    return;
                }

                // Gravity Force
                const force = (CONFIG.G * CONFIG.PLANET_MASS) / Math.max(distSq, 400);
                const ax = (force * dx) / dist;
                const ay = (force * dy) / dist;

                this.vx += ax * dt;
                this.vy += ay * dt;

                // Friction
                const drag = Math.pow(CONFIG.FRICTION, dt * 60);
                this.vx *= drag;
                this.vy *= drag;

                this.x += this.vx * dt * 60;
                this.y += this.vy * dt * 60;

                this.survivalTime += dt;

                // Sampling points for stability score
                if (Math.floor(this.survivalTime * 10) > this.orbitPoints.length) {
                    this.orbitPoints.push({ d: dist });
                }

                // Trails - every frame for smooth tracking
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > 60) this.history.shift();
            }

            draw(ctx) {
                if (this.isEliminated) return;
                this.drawTrail(ctx);
                this.drawBody(ctx);
                this.drawLabel(ctx);
            }

            getZoom() {
                return (typeof game !== 'undefined') ? game.zoom : 1;
            }

            // Tapered, additive trail batched into a few strokes (cheap with 100 players)
            drawTrail(ctx) {
                if (this.isEliminated) return;
                const h = this.history;
                const n = h.length;
                if (n <= 3) return;
                const zoom = this.getZoom();
                const buckets = 5;
                const fade = (typeof game !== 'undefined' && game.particles.length > 30) ? 0.5 : 1;
                const per = Math.ceil((n - 2) / buckets);
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = this.color;
                ctx.globalCompositeOperation = 'lighter';
                for (let b = 0; b < buckets; b++) {
                    const s = b * per;
                    const e = Math.min(n - 2, (b + 1) * per);
                    if (s >= e) break;
                    ctx.beginPath();
                    ctx.moveTo((h[s].x + h[s + 1].x) / 2, (h[s].y + h[s + 1].y) / 2);
                    for (let i = s; i < e; i++) {
                        const p1 = h[i + 1];
                        const p2 = h[i + 2];
                        ctx.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
                    }
                    const f = (b + 1) / buckets;
                    ctx.globalAlpha = (0.06 + f * f * 0.5) * fade;
                    ctx.lineWidth = (0.6 + f * 3.2) / zoom;
                    ctx.stroke();
                }
                ctx.restore();
            }

            getScreenRadius() {
                const zoom = this.getZoom();
                return Math.max(6.5, Math.min(11, CONFIG.PARTICLE_RADIUS * zoom * 1.5));
            }

            // Shaded mini-planet, lit by the accretion disk (light faces the hole)
            drawBody(ctx) {
                if (this.isEliminated) return;
                const zoom = this.getZoom();
                if (!this.sprite) this.sprite = OrbitArt.planetSprite(this.color);
                const r = this.getScreenRadius() / zoom;
                const size = r * OrbitArt.PLANET_SPAN;
                const planet = (typeof game !== 'undefined') ? game.planet : { x: 0, y: 0 };
                const ang = Math.atan2(planet.y - this.y, planet.x - this.x);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(ang);
                ctx.drawImage(this.sprite, -size / 2, -size / 2, size, size);
                ctx.restore();
            }

            drawLabel(ctx) {
                if (this.isEliminated) return;
                const zoom = this.getZoom();
                const crowded = (typeof game !== 'undefined') && game.particles.length > 30;
                if (!this.labelSprite || this.labelCrowded !== crowded) {
                    this.labelSprite = OrbitArt.labelSprite(this.name, this.color, crowded ? 11 : 13);
                    this.labelCrowded = crowded;
                }
                const label = this.labelSprite;
                const w = label.width / OrbitArt.LABEL_SCALE;
                const hgt = label.height / OrbitArt.LABEL_SCALE;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(1 / zoom, 1 / zoom);
                ctx.drawImage(label, -w / 2, -this.getScreenRadius() - 5 - hgt, w, hgt);
                ctx.restore();
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.celebCanvas = document.getElementById('celebCanvas');
                this.celebCtx = this.celebCanvas.getContext('2d');
                this.particles = [];
                this.planet = { x: 0, y: 0 };
                this.isRunning = false;
                this.isCelebrating = false;
                this.lastTime = null;
                this.accumulator = 0;
                this.rng = null;
                this.gameTime = 0;
                this.resultTimer = null;
                this.finalRankings = [];
                this.winCondition = 'survival';
                this.starCanvas = document.createElement('canvas');
                this.stars = [];
                this.mouseParticles = [];
                this.celebParticles = [];
                this.explosionParticles = [];
                this.mousePos = { x: -100, y: -100 };
                this.zoom = 1.0;
                this.sound = new SoundManager();

                window.addEventListener('resize', () => this.resize());
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mousePos.x = e.clientX - rect.left;
                    this.mousePos.y = e.clientY - rect.top;

                    for (let i = 0; i < 2; i++) {
                        // 70% of previous density (3 * 0.7 = 2.1, so 2 per move is approx correct)
                        this.mouseParticles.push(new MouseParticle(this.mousePos.x, this.mousePos.y));
                    }
                });
                this.canvas.addEventListener('mouseleave', () => {
                    this.mousePos = { x: -1000, y: -1000 };
                });
                this.resize();

                // Start idle loop
                requestAnimationFrame((t) => this.loop(t));
            }

            initStars() {
                const W = this.canvas.width, H = this.canvas.height;
                const layers = OrbitArt.background(W, H);
                this.starCanvas = layers.far;
                this.nearStarCanvas = layers.near;
                const colors = ['#fff', '#fff', '#fff', '#e0e7ff', '#7dd3fc', '#fcd34d', '#f9a8d4'];
                this.stars = [];
                for (let i = 0; i < 90; i++) {
                    this.stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        size: Math.random() < 0.3 ? 2 : 1.3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        brightness: 0.5 + Math.random() * 0.5,
                        twinkleSpeed: 0.0015 + Math.random() * 0.004,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            getViewRadius() {
                return Math.max(1, Math.min(this.canvas.width, this.canvas.height) / 2 - 38);
            }

            resize() {
                const previousRadius = this.getViewRadius();
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;

                this.celebCanvas.width = window.innerWidth;
                this.celebCanvas.height = window.innerHeight;

                const dx = this.canvas.width / 2 - this.planet.x;
                const dy = this.canvas.height / 2 - this.planet.y;
                this.planet.x += dx;
                this.planet.y += dy;

                if (this.particles.length) {
                    const translate = point => {
                        point.x += dx;
                        point.y += dy;
                    };
                    this.particles.forEach(particle => {
                        translate(particle);
                        particle.history.forEach(translate);
                    });
                    this.explosionParticles.forEach(translate);
                    const scale = this.getViewRadius() / previousRadius;
                    this.zoom *= scale;
                }
                this.initStars();
            }

            start() {
                const input = document.getElementById('participantsInput').value;
                const names = this.parseParticipants(input);
                if (names.length === 0) {
                    alert("참여자를 입력해주세요.");
                    return false;
                }

                // Reset for new game
                this.closeResult();
                this.finalRankings = [];
                this.isRunning = true;
                this.sound.init();
                this.sound.playStart();
                this.particles = [];
                this.gameTime = 0;
                document.getElementById('rankingList').innerHTML = "";
                this.lastTime = null;
                this.accumulator = 0;
                this.winCondition = document.getElementById('winCondition').value;
                const requestedCount = parseInt(document.getElementById('winnerCount').value, 10) || 1;
                this.winnerCount = Math.max(1, Math.min(requestedCount, names.length));

                this.rng = new RandomSource();

                this.particles = names.map(name => {
                    const angle = this.rng.range(0, Math.PI * 2);
                    const spawnDist = this.rng.range(350, 480); // Increased distance from planet
                    const orbitSpeed = Math.sqrt((CONFIG.G * CONFIG.PLANET_MASS) / spawnDist) * 0.12; // Even slower
                    const speed = orbitSpeed * this.rng.range(0.9, 1.1); // Lower variance for majestic flow

                    const x = this.planet.x + Math.cos(angle) * spawnDist;
                    const y = this.planet.y + Math.sin(angle) * spawnDist;

                    const vx = -Math.sin(angle) * speed;
                    const vy = Math.cos(angle) * speed;

                    const hue = this.rng.range(0, 360);
                    const particle = new Particle(name, x, y, vx, vy, `hsl(${hue}, 80%, 65%)`);
                    // Leave room for the outer part of each orbit before zooming in.
                    particle.cameraRadius = spawnDist * 1.15;
                    return particle;
                });

                const outerRadius = Math.max(...this.particles.map(p => p.cameraRadius));
                this.zoom = Math.min(1, this.getViewRadius() / outerRadius);

                document.getElementById('startBtn').disabled = true;
                document.getElementById('liveStatus').style.display = "block";
                return true;
            }

            parseParticipants(input) {
                const names = input.split(/[,\n]/).map(n => n.trim()).filter(n => n);
                const result = [];
                for (const name of names) {
                    if (result.length >= MAX_PARTICIPANTS) break;
                    const match = name.match(/^(.+)\*(\d+)$/);
                    if (match) {
                        const baseName = match[1].trim();
                        const count = Math.min(parseInt(match[2]), MAX_PARTICIPANTS - result.length);
                        for (let i = 0; i < count; i++) result.push(baseName);
                    } else {
                        result.push(name);
                    }
                }
                return result;
            }

            loop(timestamp) {
                this.lastTime ??= timestamp;
                this.accumulator += Math.min((timestamp - this.lastTime) / 1000, 0.1);
                this.lastTime = timestamp;
                const steps = Math.floor((this.accumulator + 1e-9) / ORBIT_STEP);

                if (steps > 0) {
                    this.accumulator = Math.max(0, this.accumulator - steps * ORBIT_STEP);
                    if (this.isRunning && this.resultTimer === null) {
                        for (let step = 0; step < steps; step++) {
                            this.update(ORBIT_STEP);
                            const enoughSurvivors = this.winCondition === 'survival'
                                && this.particles.length > this.winnerCount
                                && this.particles.filter(p => !p.isEliminated).length <= this.winnerCount;
                            if (this.gameTime >= 40 || enoughSurvivors) {
                                this.resultTimer = setTimeout(() => {
                                    this.resultTimer = null;
                                    this.endGame();
                                }, 1000);
                                break;
                            }
                        }
                        if (this.winCondition === 'stability') this.calculateStability();
                        this.updateUI();
                    }

                    this.draw(steps * ORBIT_STEP);
                    if (this.isCelebrating) {
                        this.updateCelebration();
                        this.drawCelebration();
                    }
                }

                requestAnimationFrame((t) => this.loop(t));
            }

            update(dt) {
                this.gameTime += dt;
                let outerRadius = 0;

                this.particles.forEach(p => {
                    p.update(dt, this.planet);
                    if (!p.isEliminated) {
                        const dx = p.x - this.planet.x;
                        const dy = p.y - this.planet.y;
                        const radius = Math.hypot(dx, dy);
                        p.cameraRadius = Math.max(p.cameraRadius, radius);
                        outerRadius = Math.max(outerRadius, p.cameraRadius);
                        if (this.winCondition === 'target' && Math.abs(radius - CONFIG.TARGET_RADIUS) < CONFIG.TARGET_WIDTH / 2) {
                            p.score += 300 * dt;
                        }
                    }
                });

                if (outerRadius > 0) {
                    const fitZoom = this.getViewRadius() / outerRadius;
                    this.zoom = Math.max(this.zoom, Math.min(fitZoom, this.zoom + 0.1 * dt));
                }
            }

            draw(dt) {
                if (!this.canvas.width || !this.canvas.height) return;
                const ctx = this.ctx;
                const W = this.canvas.width, H = this.canvas.height;
                const now = performance.now() / 1000;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';

                // Cached deep-space backdrop (far layer is fixed, near layer drifts with zoom = parallax)
                ctx.drawImage(this.starCanvas, 0, 0);
                if (this.nearStarCanvas) {
                    const p = 1 + Math.min(0.5, Math.max(0, this.zoom - 0.5) * 0.18);
                    ctx.save();
                    ctx.translate(W / 2, H / 2);
                    ctx.scale(p, p);
                    ctx.rotate(now * 0.004);
                    ctx.drawImage(this.nearStarCanvas, -W / 2, -H / 2);
                    ctx.restore();
                }
                for (let i = 0; i < this.stars.length; i++) {
                    const star = this.stars[i];
                    const twinkle = 0.55 + Math.sin(now * 1000 * star.twinkleSpeed + star.phase) * 0.45;
                    ctx.fillStyle = star.color;
                    ctx.globalAlpha = star.brightness * twinkle;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                }
                ctx.globalAlpha = 1;

                // Mouse Neon Glow
                if (this.mousePos.x > 0) {
                    const glow = ctx.createRadialGradient(this.mousePos.x, this.mousePos.y, 0, this.mousePos.x, this.mousePos.y, 120);
                    glow.addColorStop(0, 'rgba(6, 182, 212, 0.14)');
                    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = glow;
                    ctx.fillRect(this.mousePos.x - 120, this.mousePos.y - 120, 240, 240);
                }
                this.mouseParticles = this.mouseParticles.filter(p => p.alpha > 0);
                this.mouseParticles.forEach(p => {
                    p.update(dt);
                    p.draw(ctx);
                });

                ctx.save();
                ctx.translate(this.planet.x, this.planet.y);
                ctx.scale(this.zoom, this.zoom);
                ctx.translate(-this.planet.x, -this.planet.y);

                this.holeFlash = Math.max(0, (this.holeFlash || 0) - dt * 1.6);
                this.drawBlackHole(ctx, now);

                // Absorption shockwaves & infall streaks
                this.absorbFx = (this.absorbFx || []).filter(fx => fx.t < 1);
                this.absorbFx.forEach(fx => {
                    fx.t += dt / 1.1;
                    this.drawAbsorb(ctx, fx);
                });

                this.explosionParticles = this.explosionParticles.filter(p => p.alpha > 0);
                this.explosionParticles.forEach(p => {
                    p.update(dt);
                    p.draw(ctx);
                });

                const alive = this.particles;
                for (let i = 0; i < alive.length; i++) alive[i].drawTrail(ctx);
                for (let i = 0; i < alive.length; i++) alive[i].drawBody(ctx);
                for (let i = 0; i < alive.length; i++) alive[i].drawLabel(ctx);
                ctx.restore();
            }

            ensureHoleArt() {
                if (this.holeArt) return this.holeArt;
                this.holeArt = {
                    halo: OrbitArt.haloSprite(),
                    diskA: OrbitArt.diskSprite(0),
                    diskB: OrbitArt.diskSprite(1),
                    core: OrbitArt.coreSprite()
                };
                return this.holeArt;
            }

            drawBlackHole(ctx, now) {
                const art = this.ensureHoleArt();
                const { x, y } = this.planet;
                const flash = this.holeFlash || 0;
                const pulse = 0.85 + Math.sin(now * 1.7) * 0.08 + flash * 0.5;
                const haloR = 330 * (1 + flash * 0.08);
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = Math.min(1, pulse);
                ctx.drawImage(art.halo, x - haloR, y - haloR, haloR * 2, haloR * 2);
                const D = OrbitArt.DISK_WORLD;
                ctx.translate(x, y);
                ctx.save();
                ctx.rotate(now * 0.16);
                ctx.globalAlpha = 0.65;
                ctx.drawImage(art.diskB, -D, -D, D * 2, D * 2);
                ctx.restore();
                ctx.save();
                ctx.rotate(now * 0.42);
                ctx.globalAlpha = 0.95;
                ctx.drawImage(art.diskA, -D, -D, D * 2, D * 2);
                ctx.restore();
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.drawImage(art.core, -D, -D, D * 2, D * 2);
                if (flash > 0) {
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.globalAlpha = flash * 0.8;
                    ctx.strokeStyle = this.lastAbsorbColor || '#fff';
                    ctx.lineWidth = 3 / this.zoom;
                    ctx.beginPath();
                    ctx.arc(0, 0, CONFIG.PLANET_RADIUS * 1.06, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawAbsorb(ctx, fx) {
                const t = Math.min(1, fx.t);
                const { x: px, y: py } = this.planet;
                const R = CONFIG.PLANET_RADIUS;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                // Expanding shockwave ring
                ctx.globalAlpha = (1 - t) * 0.9;
                ctx.strokeStyle = fx.color;
                ctx.lineWidth = (2 + (1 - t) * 5) / this.zoom;
                ctx.beginPath();
                ctx.arc(px, py, R + 6 + t * 120, 0, Math.PI * 2);
                ctx.stroke();
                // Spaghettified streak spiralling into the horizon
                const steps = 14;
                ctx.lineCap = 'round';
                for (let i = 0; i < steps; i++) {
                    const f0 = i / steps, f1 = (i + 1) / steps;
                    const pt = f => {
                        const ff = Math.min(1, f * (1 - t) + t);
                        const ang = fx.angle + ff * 1.6;
                        const rr = fx.dist * (1 - ff) + R * 1.03 * ff;
                        return [px + Math.cos(ang) * rr, py + Math.sin(ang) * rr];
                    };
                    const [x0, y0] = pt(f0);
                    const [x1, y1] = pt(f1);
                    ctx.globalAlpha = (1 - t) * (0.2 + f0 * 0.8);
                    ctx.lineWidth = (1 + f0 * 5 * (1 - t)) / this.zoom;
                    ctx.beginPath();
                    ctx.moveTo(x0, y0);
                    ctx.lineTo(x1, y1);
                    ctx.stroke();
                }
                // Hot flash at impact point
                const ia = fx.angle + 1.6 * t;
                const ix = px + Math.cos(ia) * R, iy = py + Math.sin(ia) * R;
                const fr = (18 + 30 * (1 - t)) / Math.max(0.5, this.zoom);
                const g = ctx.createRadialGradient(ix, iy, 0, ix, iy, fr);
                g.addColorStop(0, 'rgba(255,255,255,0.9)');
                g.addColorStop(0.3, fx.color);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.globalAlpha = (1 - t);
                ctx.fillStyle = g;
                ctx.fillRect(ix - fr, iy - fr, fr * 2, fr * 2);
                ctx.restore();
            }

            getRankings() {
                const ranked = [...this.particles];
                if (this.winCondition === 'survival') {
                    return ranked.sort((a, b) => {
                        if (a.isEliminated !== b.isEliminated) return a.isEliminated ? 1 : -1;
                        if (!a.isEliminated) return b.minDist - a.minDist;
                        return b.survivalTime - a.survivalTime;
                    });
                }
                return ranked.sort((a, b) => b.score - a.score);
            }

            updateUI() {
                const sorted = this.getRankings();

                // Update Global Timer
                const timerEl = document.getElementById('gameTimer');
                if (this.isRunning) {
                    timerEl.classList.add('active');
                    timerEl.innerText = this.gameTime.toFixed(2) + "s";
                } else {
                    timerEl.classList.remove('active');
                }

                const list = document.getElementById('rankingList');
                list.innerHTML = sorted.map((p, i) => `
                    <div class="ranking-item">
                        <div class="rank ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</div>
                        <div class="particle-color" style="background:${p.color}; box-shadow: 0 0 5px ${p.color}"></div>
                        <div class="name">${escapeHtmlText(p.name)}</div>
                        <div class="metrics"></div>
                        <div class="status ${p.isEliminated ? 'eliminated' : ''}">
                            ${p.isEliminated ? p.survivalTime.toFixed(3) + 's' : `MIN:${Math.round(p.minDist)}`}
                        </div>
                    </div>
                `).join('');
            }

            calculateStability() {
                this.particles.forEach(p => {
                    if (p.isEliminated || p.orbitPoints.length < 5) return;
                    const radii = p.orbitPoints.map(pt => pt.d);
                    const mean = radii.reduce((a, b) => a + b, 0) / radii.length;
                    const variance = radii.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / radii.length;
                    // Lower variance = Higher score. We use a reciprocal with a floor.
                    p.score = p.survivalTime * 10 + (20000 / (variance + 1));
                });
            }

            endGame() {
                if (!this.isRunning) return;
                this.isRunning = false;
                this.sound.playWin();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('liveStatus').style.display = "none";

                document.getElementById('gameTimer').classList.remove('active');
                this.finalRankings = this.getRankings();
                const top = this.finalRankings.slice(0, this.winnerCount);
                const winnerNames = top.map(w => w.name).join(', ');

                // Update UI Elements
                document.getElementById('winnerName').innerText = winnerNames;

                // Generate Ranking List for UI
                const rankList = document.getElementById('finalRankingList');
                rankList.innerHTML = "";
                this.finalRankings.forEach((p, i) => {
                    const rankClass = i < 3 ? `rank-${i + 1}` : "";
                    const status = p.isEliminated ? `${p.survivalTime.toFixed(2)}s` : "SURVIVED";
                    const item = document.createElement('div');
                    item.className = `final-ranking-item ${rankClass}`;
                    item.style.animationDelay = `${i * 0.1}s`;
                    item.innerHTML = `
                        <div class="final-pos">${i + 1}</div>
                        <div class="final-name">${escapeHtmlText(p.name)}</div>
                        <div class="final-score">${status}</div>
                    `;
                    rankList.appendChild(item);
                });

                document.getElementById('resultOverlay').classList.add('active');
                this.createConfetti();
            }

            createConfetti() {
                const colors = ['#a855f7', '#38bdf8', '#fbbf24', '#f472b6', '#ffffff'];
                for (let i = 0; i < 150; i++) {
                    this.celebParticles.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * -window.innerHeight,
                        vx: (Math.random() - 0.5) * 10,
                        vy: Math.random() * 5 + 5,
                        size: Math.random() * 10 + 5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * Math.PI * 2,
                        rVel: (Math.random() - 0.5) * 0.2
                    });
                }
            }

            updateCelebration() {
                if (!this.isCelebrating) return;
                this.celebParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.rVel;
                    if (p.y > window.innerHeight) {
                        p.y = -20;
                        p.x = Math.random() * window.innerWidth;
                    }
                });
            }

            drawCelebration() {
                this.celebCtx.clearRect(0, 0, this.celebCanvas.width, this.celebCanvas.height);
                if (!this.isCelebrating) return;

                this.celebParticles.forEach(p => {
                    this.celebCtx.save();
                    this.celebCtx.translate(p.x, p.y);
                    this.celebCtx.rotate(p.rotation);
                    this.celebCtx.fillStyle = p.color;
                    this.celebCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    this.celebCtx.restore();
                });
            }

            closeResult() {
                this.isCelebrating = false;
                this.celebParticles = [];
                this.celebCtx.clearRect(0, 0, this.celebCanvas.width, this.celebCanvas.height);
                document.getElementById('resultOverlay').classList.remove('active');
            }

            reset() {
                clearTimeout(this.resultTimer);
                this.resultTimer = null;
                this.finalRankings = [];
                this.isRunning = false;
                this.closeResult();
                this.particles = [];
                this.explosionParticles = [];
                this.absorbFx = [];
                this.holeFlash = 0;
                this.gameTime = 0;
                this.zoom = 1;
                this.lastTime = null;
                this.accumulator = 0;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('liveStatus').style.display = "none";
                document.getElementById('gameTimer').classList.remove('active');
                document.getElementById('rankingList').innerHTML = '<div style="text-align: center; color: #555; font-size: 13px; margin-top: 20px;">참여자를 입력하고 시작하세요</div>';
                document.getElementById('killFeed').innerHTML = ""; // Clear feed on reset
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            createExplosion(x, y, color) {
                this.absorbFx = this.absorbFx || [];
                this.absorbFx.push({
                    color, t: 0,
                    angle: Math.atan2(y - this.planet.y, x - this.planet.x),
                    dist: Math.hypot(x - this.planet.x, y - this.planet.y) + 30
                });
                this.holeFlash = 1;
                this.lastAbsorbColor = color;
                for (let i = 0; i < 20; i++) {
                    this.explosionParticles.push(new ExplosionParticle(x, y, color));
                }
            }

            addKillMessage(name, reason) {
                const feed = document.getElementById('killFeed');
                const item = document.createElement('div');
                item.className = 'kill-item';

                let message = "";
                if (reason === "CRASHED") {
                    const msgs = [
                        "님이 행성에 충돌하여 파괴되었습니다. 💥",
                        "님이 중력을 견디지 못하고 추락했습니다. 🔥",
                        "님이 행성 표면에 소멸되었습니다. ☄️"
                    ];
                    message = msgs[Math.floor(Math.random() * msgs.length)];
                } else {
                    const msgs = [
                        "님이 궤도를 이탈하여 실종되었습니다. 📡",
                        "님이 먼 우주로 튕겨나가 사라졌습니다. ✨",
                        "님이 심우주로 사라져 행방불명되었습니다. 🌌"
                    ];
                    message = msgs[Math.floor(Math.random() * msgs.length)];
                }

                item.innerHTML = `<span style="font-weight: 800; color: #fff; margin-right: 4px;">${escapeHtmlText(name)}</span>${message}`;
                feed.insertBefore(item, feed.firstChild);

                // Auto remove from DOM after animation
                setTimeout(() => {
                    if (item.parentElement === feed) {
                        feed.removeChild(item);
                    }
                }, 4500);

                // Limit count
                while (feed.children.length > 5) {
                    feed.removeChild(feed.lastChild);
                }
            }
        }

        /**
         * 4. Initialization
         */
        const game = new Game();
        document.getElementById('startBtn').onclick = () => {
            const started = game.start();
            if (started && window.innerWidth <= 768) requestAnimationFrame(() => {
                document.querySelector('.main-content')?.scrollIntoView({
                    behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
                    block: 'start'
                });
            });
        };
        document.getElementById('resetBtn').onclick = () => game.reset();
        document.getElementById('restartBtn').onclick = () => game.closeResult();

        document.getElementById('copyResultOverlayBtn').onclick = () => {
            const btn = document.getElementById('copyResultBtn');
            btn.click();
        };

        // LocalStorage logic
        const STORAGE_KEY = 'gravity_orbit_settings';
        function saveSettings() {
            const settings = {
                participants: document.getElementById('participantsInput').value,
                winCondition: document.getElementById('winCondition').value,
                winnerCount: document.getElementById('winnerCount').value
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
            } catch { /* Storage may be unavailable. */ }
        }

        function loadSettings() {
            try {
                const settings = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (typeof settings?.participants === 'string') document.getElementById('participantsInput').value = settings.participants;
                const condition = document.getElementById('winCondition');
                if ([...condition.options].some(option => option.value === settings?.winCondition)) {
                    condition.value = settings.winCondition;
                }
                if (settings?.winnerCount != null) document.getElementById('winnerCount').value = settings.winnerCount;
            } catch { /* Keep defaults when saved settings cannot be read. */ }
        }

        document.getElementById('participantsInput').oninput = saveSettings;
        document.getElementById('winCondition').onchange = saveSettings;
        document.getElementById('winnerCount').onchange = saveSettings;
        loadSettings();

        // Copy Results
        document.getElementById('copyResultBtn').onclick = async () => {
            const sorted = game.finalRankings;
            if (!sorted.length) {
                showToast('복사할 결과가 없습니다.');
                return;
            }
            const winners = sorted.slice(0, game.winnerCount).map(p => p.name).join(', ');

            let resultText = `🪐 중력 궤도 생존 추첨 결과\n`;
            resultText += `당첨자: ${winners}\n\n`;
            resultText += `[전체 순위]\n`;

            sorted.forEach((p, i) => {
                const status = p.isEliminated ? `${p.survivalTime.toFixed(3)}s` : '생존 (ALIVE)';
                resultText += `${i + 1}위. ${p.name} (${status})\n`;
            });

            try {
                await navigator.clipboard.writeText(resultText);
                showToast('전체 결과가 복사되었습니다! ✨');
            } catch {
                showToast('결과를 복사하지 못했습니다.');
            }
        };

        // Help Modal (Simple alert for brevity, or full modal if needed)
        document.getElementById('helpBtn').onclick = () => {
            alert("🪐 중력 궤도 생존 추첨 가이드\n\n1. 참여자를 입력합니다 (쉼표/줄바꿈 구분).\n2. 당첨 규칙을 선택합니다.\n   - 서바이벌: 태양에 충돌하거나 튕겨나가지 않고 생존\n   - 안정성: 궤도가 얼마나 일정한 원형인가\n   - 타겟: 특정 궤도 범위(하늘색)에 오래 머물기\n3. 시작 버튼을 누르면 매번 새로운 무작위 물리 시뮬레이션이 진행됩니다.");
        };
    </script>
    <div id="toast" role="status" aria-live="polite">
        <span class="toast-icon">✅</span>
        <span class="toast-text">결과가 복사되었습니다!</span>
    </div>
</body>
